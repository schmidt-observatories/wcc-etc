name: Deploy docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions required by the official GitHub Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandoc (needed by nbsphinx to render notebooks)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install the package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .                              # so autodoc can import wcc_etc
          pip install -r docs/sphinx/requirements.txt   # Sphinx + theme + nbsphinx

      - name: Build the Sphinx site
        run: sphinx-build -b html docs/sphinx docs/sphinx/_build/html

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
