[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcc_etc"
version = "0.1.0"
authors = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"},
  {name = "Mickael Rigault", email = "m.rigault@ip2i.in2p3.fr"},
  {name = "Sanchit Sabhlok", email = "ssabhlok@arizona.edu"},
  {name = "Aaron Goldtooth", email = "gold1992@arizona.edu"},
]
maintainers = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"}
]
description = "Exposure Time Calculator for the WCC."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
  "synphot",
  "numpy",
  "astropy",
  "matplotlib",
  "pandas",
  "bokeh>=3.6",
  "flask",
  "toml",
  "tifffile",
  "photutils",
]

[project.optional-dependencies]
lightcurve = ["jaxoplanet"]
exoarchive = ["astroquery"]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
  "ipykernel",
  "myst-parser",
]
dev = [
  "pytest",
  "pre-commit",
  "ruff",
  "mypy",
]

# The 370 MB Airy+scatter PSF and the 24 MB FRED .fgd are large local products,
# not something to bake into a wheel. Regenerate them from the notebook.
[tool.setuptools.exclude-package-data]
"wcc_etc" = [
  "data/psfs/lazuli_focal_plane_airy_scatter_450nm.fits",
  "data/psfs/lazuli_focal_plane_airy_noscatter_450nm.fits",
  "data/psfs/scatter/*",
  "data/psfs/*_report.pdf",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/wcc-etc"
Repository = "https://github.com/schmidt-observatories/wcc-etc"

# Both packages build from this one pyproject: wcc_etc from src/, and
# lazuli_transit from packages/lazuli-transit/src. lazuli-transit is not on
# PyPI, so declaring it as an external dependency made the documented
# "pip install -e ." fail. Building it here keeps the install one step.
# packages/lazuli-transit/pyproject.toml is deliberately left in place so
# the package stays independently installable (the IFS consumes it directly)
# and can still move to its own repo.
[tool.setuptools.packages.find]
where = ["src", "packages/lazuli-transit/src"]

[tool.setuptools.package-data]
"wcc_etc" = [
  "data/astr_obj_models/stars/pickles_models/dat_uvk/*.fits",
  "data/astr_obj_models/galaxies/brown/*",
  "data/astrophysics/*",
  "data/config/*",
  "data/sensors/**",
  "data/throughput/*",
  "data/throughput/other_filters/*",
  "data/flats/*",
  "data/psfs/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve `lazuli_transit` to the copy vendored in this repo, ahead of any
# editable install of the standalone lazuli-transit repo that may be on the
# path, so local runs test the same source CI does.
pythonpath = [".", "packages/lazuli-transit/src"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
