[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcc_etc"
version = "0.1.0"
authors = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"},
  {name = "Mickael Rigault", email = "m.rigault@ip2i.in2p3.fr"},
  {name = "Sanchit Sabhlok", email = "ssabhlok@arizona.edu"},
  {name = "Aaron Goldtooth", email = "gold1992@arizona.edu"},
]
maintainers = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"}
]
description = "Exposure Time Calculator for the WCC."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
  "synphot>=1.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "bokeh>=3.6",
  "tifffile",
  "photutils>=1.10",
  # Transit models + Exoplanet Archive helpers (lazuli_exo.transit).
  "lazuli-exo>=0.1.2",
  # NGC galaxy thumbnails and spectra for real-galaxy hosts (wcc_etc.galaxy).
  "lazuli-astrosim-data>=0.1.0",
]

[project.optional-dependencies]
lightcurve = ["lazuli-exo[transit]>=0.1.2"]
exoarchive = ["lazuli-exo[archive]>=0.1.2"]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
  "ipykernel",
  "myst-parser",
]
dev = [
  "pytest",
  "pre-commit",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/wcc-etc"
Repository = "https://github.com/schmidt-observatories/wcc-etc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wcc_etc" = [
  "data/astr_obj_models/stars/pickles_models/dat_uvk/*.fits",
  "data/astr_obj_models/galaxies/brown/*",
  "data/astrophysics/*",
  "data/config/*",
  "data/sensors/**",
  "data/throughput/*",
  "data/throughput/other_filters/*",
  # Only the two bundled defocus PSF products ship; the Zemax .txt exports, the
  # 70 MB Airy+scatter FITS and the FRED .fgd grid stay local (#62).
  "data/psfs/CAD_*_Huygens-PSF-Data_Linear.fits",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
