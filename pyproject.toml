[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcc_etc"
version = "0.1.0"
authors = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"},
  {name = "Mickael Rigault", email = "m.rigault@ip2i.in2p3.fr"},
  {name = "Sanchit Sabhlok", email = "ssabhlok@arizona.edu"},
  {name = "Aaron Goldtooth", email = "gold1992@arizona.edu"},
]
maintainers = [
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"}
]
description = "Exposure Time Calculator for the WCC."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
  "synphot",
  "numpy",
  "scipy",
  "astropy",
  "matplotlib",
  "pandas",
  "bokeh>=3.6",
  "flask",
  "tifffile",
  "photutils",
  # Transit models + Exoplanet Archive helpers (lazuli_exo.transit).
  # TODO(#107): switch to "lazuli-exo>=0.2.0" once lazuli-exo is on PyPI; a
  # direct URL works for pip/CI/RTD but PyPI refuses to host a wheel that has one.
  "lazuli-exo @ git+https://github.com/schmidt-observatories/lazuli-exo.git@feat/absorb-lazuli-transit",
]

[project.optional-dependencies]
lightcurve = ["lazuli-exo[transit]"]
exoarchive = ["lazuli-exo[archive]"]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
  "ipykernel",
  "myst-parser",
]
dev = [
  "pytest",
  "pre-commit",
  "ruff",
  "mypy",
]

# The 370 MB Airy+scatter PSF and the 24 MB FRED .fgd are large local products,
# not something to bake into a wheel. Regenerate them from the notebook.
[tool.setuptools.exclude-package-data]
"wcc_etc" = [
  "data/psfs/lazuli_focal_plane_airy_scatter_450nm.fits",
  "data/psfs/lazuli_focal_plane_airy_noscatter_450nm.fits",
  "data/psfs/scatter/*",
  "data/psfs/*_report.pdf",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/wcc-etc"
Repository = "https://github.com/schmidt-observatories/wcc-etc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wcc_etc" = [
  "data/astr_obj_models/stars/pickles_models/dat_uvk/*.fits",
  "data/astr_obj_models/galaxies/brown/*",
  "data/astrophysics/*",
  "data/config/*",
  "data/sensors/**",
  "data/throughput/*",
  "data/throughput/other_filters/*",
  "data/flats/*",
  "data/psfs/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
