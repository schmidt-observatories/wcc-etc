# Read the Docs build configuration for the wcc-etc Sphinx site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx renders the tutorial notebooks via pandoc
    - pandoc
  jobs:
    # wcc_etc depends on lazuli-transit, which currently lives in a separate
    # *private* repo RTD can't clone. We mock that import for the docs (see
    # docs/sphinx/conf.py: autodoc_mock_imports) and install the package WITHOUT
    # its deps; its real third-party deps come from docs/sphinx/requirements.txt
    # (installed via python.install below). Once lazuli-transit is public, drop
    # this and add `- method: pip; path: .` under python.install instead.
    post_install:
      - pip install -e . --no-deps

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

python:
  install:
    # Sphinx + theme + nbsphinx + wcc_etc's third-party runtime deps
    - requirements: docs/sphinx/requirements.txt

formats:
  - htmlzip
