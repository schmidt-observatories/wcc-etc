# Read the Docs build configuration for the wcc-etc Sphinx site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx renders the tutorial notebooks via pandoc
    - pandoc

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

python:
  install:
    # Transit core: wcc_etc depends on lazuli-transit, install it first
    - method: pip
      path: packages/lazuli-transit
    # Install the package itself so autodoc can import wcc_etc, plus the
    # Sphinx toolchain from the [docs] extra in pyproject.toml
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
