# config.toml
# Configuration file for the WCC ETC

#########################################################
#########################################################
# Telescope Parameters
#########################################################
[telescope]
diameter_primary = 3.065 # m
f_num = 15.0 # unitless
# Mirror coatings
path_m1_coating = ""
path_m2_coating = ""
path_m3_coating = ""
path_m4_coating = ""
# Filter choice
#path_filter = "../data/support_data/filters/sdss_r_005_syn.fits"
path_filter = ""
#path_filter = "../data/support_data/filters/SLOAN_SDSS.gprime_filter.txt"
#path_filter = "../data/support_data/filters/sdss_i_005_syn.fits"
#path_total_throughput = "../data/support_data/throughput/Lazuli_WCC_r_20250820/Lazuli_WCC_r_20250820_throughput.csv"
path_total_throughput = "throughput/Lazuli_WCC_r_20250926_EOL_RTX/Lazuli_WCC_r_20250926_EOL_RTX_throughput.csv"
#########################################################

#########################################################
#########################################################
# Detector parameters
# Notes: 
# - Gain, dark, read and well-depth are all estimated 
#   from interpolating the .csv tables using the 'gain_setting' parameter
#########################################################
[detector]
pixel_size = 3.76 # micron / pix
#read_noise = 1.5 # CHECK
#dark_current = 0.01 # CHECK
gain_setting = 100 # 0.1 db
sensor_temp = 0.0 # C
sensor_area = 864 # mm2: (36 mm * 24mm = 864 mm2)
path_dark_current = "sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Dark_Current_vs_Sensor_Temperature.csv"
path_gain_curve =   "sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Gain_vs_Gain_Setting.csv"
path_read_noise =   "sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Read_Noise_vs_Gain_Setting.csv"
path_well_depth =   "sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Well_Depth_vs_Gain_Setting.csv"
path_qe = ""
#temp_stability = '0.1Kelvin/hour' # WAG
#########################################################

#########################################################
#########################################################
# Astrophysical Parameters
#########################################################
[zodi]
zodi_mag_r=22.5 #  L3-0016 has v-band mag of 22.1. Need trace of where 22.5 originates from.
#########################################################

# Systematic error sources
