# -- full well capacity: 30k e-;
# -- GS (single sampling read) noise: 90 e-;
# -- DRRS (similar to correlated double sampling read mode, but it’s multi sampling yet not a non-distructive sample-up-the-ramp): 30 e-
# LCG (low gain mode):
# -- gain: 17e-/ADU
# -- FWC: 50k e-;
# -- GS noise: 180 e-; 
# -- DRRS noise: 60e-
