# config.toml
# Configuration file for the WCC ETC

# Telescope
[telescope]
diameter_primary = 3.065 # m
f_num = 15.0 # unitless
path_m1_coating = "../data/support_data/coatings/NIST_1st_surface_Al.csv"
path_m2_coating = "../data/support_data/coatings/NIST_1st_surface_Al.csv"
path_m3_coating = "../data/support_data/coatings/NIST_1st_surface_Al.csv"
path_m4_coating = "../data/support_data/coatings/NIST_1st_surface_Al.csv"
path_filter = "../data/support_data/filters/sdss_r_005_syn.fits"
#path_filter = "../data/support_data/filters/sdss_i_005_syn.fits"

# Detector
[detector]
pixel_size = 3.76 # micron / pix
# path_QE
read_noise = 1.5 # CHECK
dark_current = 0.01 # CHECK
gain_setting = 100 # 0.1 db
path_qe = "../data/support_data/sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_QE_curve.csv"
sensor_temp = 0.0 # C
sensor_area = 864 # 36 mm * 24mm = 864 mm2
path_dark_current = "../data/support_data/sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Dark_Current_vs_Sensor_Temperature.csv"
path_gain_curve =   "../data/support_data/sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Gain_vs_Gain_Setting.csv"
path_read_noise =   "../data/support_data/sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Read_Noise_vs_Gain_Setting.csv"
path_well_depth =   "../data/support_data/sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_Well_Depth_vs_Gain_Setting.csv"
#sensor_temp = 0 #C #'20Celsius' # CBE
#temp_nominal_range = '1Kelvin' # CBE
#temp_stability = '0.1Kelvin/hour' # WAG
#black_level = 100
#gain = 100
#pixel_size = '3.76e-6m'
#qe = "sensors/ZWO_ASI6200MM/ZWO_ASI6200MM_Pro_QE_curve.fits" 

[zodi]
zodi_mag_r=22.5 #  L3-0016 has v-band mag of 22.1. Need trace of where 22.5 originates from.

